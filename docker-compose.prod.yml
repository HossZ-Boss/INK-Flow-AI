services:
  ai:
    container_name: tattoo_hysteria_ai
    image: tattoo-hysteria-ai:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8001"
    networks:
      - tattoo_hysteria_net
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - learning_data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  learning_data:
    name: tattoo_hysteria_ai_learning_data

networks:
  tattoo_hysteria_net:
    name: tattoo_hysteria_net
    external: true

